server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # serve the pre-compressed .br / .gz of index.html and the app script built in the Dockerfile
  # (browsers only ask for Brotli over HTTPS; everything else gets the gzip file)
  brotli_static on;
  gzip_static on;
  gzip_vary on;

  # fallback for anything not pre-compressed
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # content-hashed, so it can be cached forever
  location ~ ^/app\.[0-9a-f]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /favicon.png {
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
