server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # serve the pre-compressed index.html.br / index.html.gz built in the Dockerfile
  # (browsers only ask for Brotli over HTTPS; everything else gets the gzip file)
  brotli_static on;
  gzip_static on;
  gzip_vary on;

  # fallback for anything not pre-compressed
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /favicon.png {
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
